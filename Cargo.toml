# VisualAssembler virtual workspace manifest.
# Normative content: docs/specs/m0-foundations.md §3.1, amended by §17.1 (licence) and §19.8 (winit),
# and amended by m1-core-isa-lexer.md §8 (fluent-bundle, unic-langid and the internal crates).
# Comments may be added; values must not change.

[workspace]
resolver = "3"
members = [
    "crates/va-core",
    "crates/va-editor",
    "crates/va-lang",
    "crates/va-debug",
    "crates/va-workspace",
    "crates/va-ui",
    "arch/m68k",
    "apps/visual-assembler",
    "apps/va",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
# Dual licence (m0-foundations.md §17.1, architecture §9.7): texts in LICENSE-MIT and LICENSE-APACHE.
license = "MIT OR Apache-2.0"

# Exact pins, each declared by at least one member (rule R6, enforced by check_project_docs.py check 3b).
# Internal crates are added here when first used (M1+), e.g. va-core = { path = "crates/va-core" }.
# Every entry needs a DEPENDANCE.md line and an IMPORT.md entry.
[workspace.dependencies]
anyhow = "=1.0.104"
clap = { version = "=4.6.7", features = ["derive"] }
eframe = { version = "=0.36.2", default-features = false, features = ["accesskit", "default_fonts", "wayland", "x11"] }
egui_kittest = "=0.36.2"
fluent-bundle = "=0.16.0"
libc = "=0.2.189"
raw-window-handle = "=0.6.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
unic-langid = "=0.9.6"
va-arch-m68k = { path = "arch/m68k" }
va-core = { path = "crates/va-core" }
va-workspace = { path = "crates/va-workspace" }
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_System_ProcessStatus", "Win32_System_Threading"] }
# m0-foundations.md §19.1/§19.8 row 19-1: X11 event loop under WSL (EventLoopBuilderExtX11::with_x11).
# Members declare it under [target.'cfg(target_os = "linux")'.dependencies]; same version eframe pulls.
winit = { version = "=0.30.13", default-features = false, features = ["x11"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
unwrap_used = "warn"
undocumented_unsafe_blocks = "warn"

[profile.release]
lto = "thin"

# Dependencies at opt-level 2 keep a debug GUI usable; workspace crates stay at 0 for debugging.
[profile.dev.package."*"]
opt-level = 2
