# Developer task runner behind `make` (docs/specs/m0-foundations.md §6).
# Rule R5: no workspace crate as a dependency; it drives cargo and the built binaries as processes.
[package]
name = "xtask"
description = "Developer task runner (bench, ci, docs, hooks)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
