# `va`: the VisualAssembler command-line interface (binary only).
# Template: docs/specs/m0-foundations.md §3.6; behaviour: §5. Dependencies come from the root
# [workspace.dependencies] with exact pins (rule R6). No GUI crate may appear here (rule R4).
[package]
name = "va"
description = "VisualAssembler command-line interface."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
va-arch-m68k = { workspace = true, optional = true }
va-core = { workspace = true }
va-workspace = { workspace = true }

# m1-core-isa-lexer.md §7.1, §8: each CPU crate is an optional feature, registered by
# src/arch_registry.rs; a build without any `arch-*` feature has no architecture.
[features]
default = ["arch-m68k"]
arch-m68k = ["dep:va-arch-m68k"]

[lints]
workspace = true
